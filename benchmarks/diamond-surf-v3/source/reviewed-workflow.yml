name: Isolated DiamondChallenger wave-defense pilot
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  pressure:
    if: github.head_ref == 'experiment/diamond-wave-v3'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Freeze the separate challenger and prove production unchanged
        shell: bash
        run: |
          test -z "$(git diff --name-only b35788a9be47caec1cb583486a0b0b1f1eb9f92e HEAD -- experiments/DiamondChallenger src/main/java src/test/java AISurvivor build.gradle settings.gradle)"
          test -z "$(git diff --name-only 9b1624da2d9b09ec9cc4f580b51bc82edd2c1485 HEAD -- src/main/java src/test/java AISurvivor build.gradle settings.gradle)"
          echo 'b41b5de479b1288f087e0cbc9efa64abb68f12381b41d33ad65ff48be5914800  AISurvivor/AISurvivor.jar' | sha256sum -c -
          echo '9a4e0cc01f28e050fd9315719079b2e0163e86966a27a4ce34da870863f90717  experiments/DiamondChallenger/DiamondChallenger.jar' | sha256sum -c -
          ./gradlew -p experiments/DiamondChallenger --no-daemon clean build
          python tools/verify_jar.py experiments/DiamondChallenger/DiamondChallenger.jar experiments/DiamondChallenger/build/bot/DiamondChallenger/DiamondChallenger.jar
          cp experiments/DiamondChallenger/DiamondChallenger.jar experiments/DiamondChallenger/build/bot/DiamondChallenger/DiamondChallenger.jar
          echo 'b41b5de479b1288f087e0cbc9efa64abb68f12381b41d33ad65ff48be5914800  AISurvivor/AISurvivor.jar' | sha256sum -c -
          python -m unittest discover -s tools -p 'test_diamond_surf_experiment.py'
          python -m unittest discover -s tools -p 'test_strong*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: One20-round pilot, conditional fresh60-round confirmation
        run: >-
          python tools/diamond_surf_experiment.py
          --bot-dir experiments/DiamondChallenger/build/bot/DiamondChallenger
          --java "$JAVA_HOME/bin/java" --output build/diamond-wave-v3
      - name: Preserve every original outcome, private endpoint and runtime pin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-wave-v3-${{ github.event.pull_request.head.sha }}
          path: |
            build/diamond-wave-v3/
            tools/diamond_surf_experiment.py
            tools/test_diamond_surf_experiment.py
            tools/strong_melee_opponents.py
            tools/opponents/strong-melee.lock.json
            experiments/DiamondChallenger/
            .github/workflows/diamond-wave-v3.yml
          retention-days: 30
          if-no-files-found: warn
