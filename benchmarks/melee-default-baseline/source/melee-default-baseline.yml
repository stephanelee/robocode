name: Frozen default four-bot melee baseline
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  melee:
    if: github.head_ref == 'codex/melee-baseline'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen accepted source and fresh build parity
        shell: bash
        run: |
          test -z "$(git diff --name-only e4e4c94a45c770a494f6a60f6b98456e215bee42 HEAD -- src/main/java src/test/java AISurvivor tools/benchmark.py tools/BenchmarkBattle.java tools/coherent_duel_v2_experiment.py)"
          mkdir -p "$RUNNER_TEMP/frozen-melee"
          for name in AISurvivor.jar AISurvivor.json AISurvivor.sh AISurvivor.cmd; do
            git show "e4e4c94a45c770a494f6a60f6b98456e215bee42:AISurvivor/$name" > "$RUNNER_TEMP/frozen-melee/$name"
          done
          echo "9679fc5ee27b68877f0b6d89a2104ffff115d6251ec44d3036fdd1f1d64988a6  $RUNNER_TEMP/frozen-melee/AISurvivor.jar" | sha256sum -c -
          rm AISurvivor/AISurvivor.jar
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/frozen-melee/AISurvivor.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_melee_default_baseline.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: One registered three-game melee baseline
        run: >-
          python tools/melee_default_baseline.py --bot-dir "$RUNNER_TEMP/frozen-melee"
          --java "$JAVA_HOME/bin/java" --output build/melee-default-baseline
      - name: Preserve complete or failed descriptive attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melee-default-baseline-${{ github.event.pull_request.head.sha }}
          path: |
            build/melee-default-baseline/
            tools/melee_default_baseline.py
            tools/test_melee_default_baseline.py
            .github/workflows/melee-default-baseline.yml
          retention-days: 30
          if-no-files-found: warn
