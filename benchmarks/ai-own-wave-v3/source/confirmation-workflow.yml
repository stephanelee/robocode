name: Frozen old-wave collector-compatible confirmation
on:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    name: Capture only 18 fresh confirmation rounds
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      manifest_sha: ${{ steps.capture.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify accepted collector, frozen model, passed screen and unused IDs
        run: |
          echo 'a34109512f3d451ceee64b1e47342d91b07eae8be3f1670896c448925562ddcc  benchmarks/ai-own-wave-v3/model.json' | sha256sum --check
          echo '4070177e8917fc9a131f31e6c63f215a78996bfcf665ae512412cb32126b9005  benchmarks/ai-own-wave-v3/development-report.json' | sha256sum --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import confirm_own_wave_collector_compat as compat
          compat.validate_frozen(Path("benchmarks/ai-own-wave-v3/model.json"), Path("benchmarks/ai-own-wave-v3/development-report.json"), Path("tools"))
          model = json.loads(Path('benchmarks/ai-own-wave-v3/model.json').read_text())
          screen = json.loads(Path('benchmarks/ai-own-wave-v3/development-report.json').read_text())
          assert screen['decision']['status'] == 'development-pass'
          assert screen['modelSha256'] == 'a34109512f3d451ceee64b1e47342d91b07eae8be3f1670896c448925562ddcc'
          layout = json.loads(subprocess.check_output(['git', 'show', 'c99d83dd69df3f325cc2f76cfe06076832b37787:tools/fixtures/own-wave-v3/retry-games.json']))
          registration = json.loads(subprocess.check_output(['git', 'show', 'c99d83dd69df3f325cc2f76cfe06076832b37787:tools/fixtures/own-wave-v3/collector-compat.json']))
          assert layout['games'] == registration['games']
          assert not ({g['gameId'] for g in layout['games']} & set(registration['excludedGameIds']))
          subprocess.run(['git', 'diff', '--exit-code', registration['collectorSourceCommit'], 'HEAD', '--', 'src/main/java', 'src/test/java', 'AISurvivor/AISurvivor.jar'], check=True)
          assert len(layout['games']) == 6 and layout['roundsPerGame'] == 3
          assert not ({g['gameId'] for g in layout['games']} & set(model['priorGameIds']))
          assert not ({g['acquisitionId'] for g in layout['games']} & set(model['priorAcquisitionIds']))
          PY
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/accepted-collector.jar"
          rm AISurvivor/AISurvivor.jar
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/accepted-collector.jar" AISurvivor/AISurvivor.jar
          echo '5ebfa64adf38ab227766b97f7f68e82aefb20251ff8d5f30575bf6b69e67c883  AISurvivor/AISurvivor.jar' | sha256sum --check
          python -m unittest discover -s tools -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Capture exact newly registered six games with unchanged controller
        id: capture
        run: |
          python tools/acquire_motion_pilot.py --confirmation --wave-context --collector-retry --plan-commit c99d83dd69df3f325cc2f76cfe06076832b37787 --java "$JAVA_HOME/bin/java" --output build/own-wave-confirm-b
          echo "manifest_sha=$(sha256sum build/own-wave-confirm-b/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-wave-v3b-fresh-capture
          path: build/own-wave-confirm-b/
          if-no-files-found: warn
  confirm:
    name: Single frozen fresh confirmation evaluation
    needs: capture
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: own-wave-v3b-fresh-capture
          path: build/own-wave-confirm-b
      - name: Evaluate only new games once, without fitting
        env:
          MANIFEST_SHA: ${{ needs.capture.outputs.manifest_sha }}
        run: |
          python tools/confirm_own_wave_collector_compat.py --registration-commit c99d83dd69df3f325cc2f76cfe06076832b37787 --registration-path tools/fixtures/own-wave-v3/collector-compat.json --capture-source-commit "${{ github.event.pull_request.head.sha }}" --manifest build/own-wave-confirm-b/manifest.json --events build/own-wave-confirm-b/events.jsonl --model benchmarks/ai-own-wave-v3/model.json --confirmation-manifest-sha256 "$MANIFEST_SHA" --screen-report benchmarks/ai-own-wave-v3/development-report.json --output build/own-wave-fresh-results-b
          cat build/own-wave-fresh-results-b/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-wave-v3b-fresh-results
          path: build/own-wave-fresh-results-b/
          if-no-files-found: warn
