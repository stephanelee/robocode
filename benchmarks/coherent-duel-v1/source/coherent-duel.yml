name: Coherent default duel whole-product comparison
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen production and independently rebuild
        shell: bash
        run: |
          test -z "$(git diff --name-only 9c79e4e26b3323704df5dad467af182e0b48fafd HEAD -- src/main/java src/test/java AISurvivor)"
          echo '9daf9cf0e24f319900fee1c8869d50df4ffb004719b1380a8db40fb4961551f6  AISurvivor/AISurvivor.jar' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/whole-candidate" "$RUNNER_TEMP/whole-previous"
          cp AISurvivor/AISurvivor.{jar,json,sh,cmd} "$RUNNER_TEMP/whole-candidate/"
          for name in AISurvivor.jar AISurvivor.json AISurvivor.sh AISurvivor.cmd; do
            git show "7104b65d03298caceb010a5bfd085bda65092d17:AISurvivor/$name" > "$RUNNER_TEMP/whole-previous/$name"
          done
          echo "d047bf99325d2ad73aedd87eac6a4baa1677170afff0c86b948f03ea93390e1d  $RUNNER_TEMP/whole-previous/AISurvivor.jar" | sha256sum -c -
          rm AISurvivor/AISurvivor.jar
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/whole-candidate/AISurvivor.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_coherent_duel_experiment.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: One complete registered roster
        run: >-
          python tools/coherent_duel_experiment.py
          --candidate "$RUNNER_TEMP/whole-candidate"
          --previous "$RUNNER_TEMP/whole-previous"
          --java "$JAVA_HOME/bin/java"
          --output build/coherent-duel
      - name: Preserve complete or failed attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherent-duel-whole-product-${{ github.event.pull_request.head.sha }}
          path: |
            build/coherent-duel/
            tools/coherent_duel_experiment.py
            tools/test_coherent_duel_experiment.py
            .github/workflows/coherent-duel.yml
          retention-days: 30
          if-no-files-found: warn
