name: Blended duel danger whole-product comparison
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  comparison:
    if: github.head_ref == 'improve/blended-duel-danger'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Freeze both source bundles and independently build candidate
        shell: bash
        run: |
          test -z "$(git diff --name-only 5b4bfdff52927148e5092a333769d4c3630530a5 HEAD -- src/main/java src/test/java AISurvivor)"
          mkdir -p "$RUNNER_TEMP/danger-previous" "$RUNNER_TEMP/danger-candidate"
          for name in AISurvivor.jar AISurvivor.json AISurvivor.sh AISurvivor.cmd; do
            git show "9b1624da2d9b09ec9cc4f580b51bc82edd2c1485:AISurvivor/$name" > "$RUNNER_TEMP/danger-previous/$name"
            git show "5b4bfdff52927148e5092a333769d4c3630530a5:AISurvivor/$name" > "$RUNNER_TEMP/danger-candidate/$name"
          done
          echo "b41b5de479b1288f087e0cbc9efa64abb68f12381b41d33ad65ff48be5914800  $RUNNER_TEMP/danger-previous/AISurvivor.jar" | sha256sum -c -
          echo "aaf2c92d0df5ad203f27bd1da554dd73acfdf929349746150b405c6b404ad5a9  $RUNNER_TEMP/danger-candidate/AISurvivor.jar" | sha256sum -c -
          rm AISurvivor/AISurvivor.jar
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/danger-candidate/AISurvivor.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_blended_danger_experiment.py'
          python -m unittest discover -s tools -p 'test_strong*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: One fixed screen and conditional fresh confirmation
        run: >-
          python tools/blended_danger_experiment.py
          --previous "$RUNNER_TEMP/danger-previous" --candidate "$RUNNER_TEMP/danger-candidate"
          --java "$JAVA_HOME/bin/java" --output build/blended-duel-danger
      - name: Preserve every complete or invalid stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blended-duel-danger-${{ github.event.pull_request.head.sha }}
          path: |
            build/blended-duel-danger/
            tools/blended_danger_experiment.py
            tools/test_blended_danger_experiment.py
            tools/strong_melee_opponents.py
            tools/opponents/strong-melee.lock.json
            .github/workflows/blended-duel-danger.yml
          retention-days: 30
          if-no-files-found: warn
