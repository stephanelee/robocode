plugins {
    id 'java'
}

group = 'dev.robocode.experiments'
version = '0.3.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories { mavenCentral() }

dependencies {
    implementation 'dev.robocode.tankroyale:robocode-tankroyale-bot-api:1.4.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

sourceSets {
    main.java.srcDirs = ['src']
    test.java.srcDirs = ['test']
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    workingDir = file('bot')
    systemProperty 'meridian.fixture', file('../../local-evidence/control.battle.gz').absolutePath
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    archiveFileName = 'Meridian.jar'
    destinationDirectory = layout.buildDirectory.dir('bot/Meridian')
    manifest { attributes 'Main-Class': 'Meridian' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('prepareBot', Copy) {
    dependsOn jar
    from 'bot'
    into layout.buildDirectory.dir('bot/Meridian')
}
assemble.dependsOn tasks.named('prepareBot')

// Isolated component diagnostic. Compile only: no test, bot or acquisition task runs it.
sourceSets {
    diagnostic {
        java.srcDirs = ['diagnostic']
        compileClasspath = files('Meridian.jar') + configurations.testRuntimeClasspath
        runtimeClasspath = output + compileClasspath
    }
}
tasks.register('waveSupportJar', Jar) {
    dependsOn tasks.named('diagnosticClasses')
    archiveFileName = 'wave-support-diagnostic.jar'
    destinationDirectory = layout.buildDirectory.dir('wave-support')
    from sourceSets.diagnostic.output
    manifest { attributes 'Main-Class': 'WaveSupportDiagnostic' }
}
tasks.register('waveSupportArtifact') {
    dependsOn tasks.named('waveSupportJar')
    doLast {
        def entries = [tasks.named('waveSupportJar').get().archiveFile.get().asFile]
        entries.addAll((sourceSets.diagnostic.runtimeClasspath - sourceSets.diagnostic.output).files)
        layout.buildDirectory.file('wave-support/classpath.txt').get().asFile.text =
            entries.collect { it.absolutePath }.join('\n') + '\n'
    }
}
