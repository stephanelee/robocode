plugins {
    id 'java'
}

group = 'dev.robocode.experiments'
version = '0.3.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories { mavenCentral() }

dependencies {
    implementation 'dev.robocode.tankroyale:robocode-tankroyale-bot-api:1.4.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main.java {
        srcDirs = ["src", "../../src/main/java"]
        include "Breakwater*.java", "CombatMath.java", "DuelRadar.java", "DuelSurf.java", "DuelGun.java", "EnemyFireTracker.java"
    }
    test.java.srcDirs = ["test"]
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    archiveFileName = 'Breakwater.jar'
    destinationDirectory = layout.buildDirectory.dir('bot/Breakwater')
    manifest { attributes 'Main-Class': 'Breakwater' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('prepareBot', Copy) {
    dependsOn jar
    from 'bot'
    into layout.buildDirectory.dir('bot/Breakwater')
}
assemble.dependsOn tasks.named('prepareBot')

// Exercise terminal and late API callbacks against the launched artifact, without starting a battle.
test.dependsOn tasks.named('prepareBot')
