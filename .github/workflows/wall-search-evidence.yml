name: Wall search evidence transfer

# Temporary: copy the existing run 41546243537 artifact into the branch. Plays no matches. Removed afterwards.
on:
  push:
    branches: [claude/wall-search]
    paths: [.github/workflows/wall-search-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wall-search-evidence
          run-id: 41546243537
          github-token: ${{ github.token }}
          path: benchmarks/wall-search/raw
      - name: Commit evidence
        run: |
          du -ah benchmarks/wall-search/raw | sort -h | tail -25
          # Keep only results/telemetry/logs/native stats; bot and opponent bundles are pinned and hashed in comparison.json.
          find benchmarks/wall-search/raw -type f ! \( -name battle.json -o -name metrics.jsonl -o -name runner.log -o -name comparison.json -o -name experiment.json -o -name preregistered-plan.md -o -path '*/retcon-stats/*' \) -delete
          find benchmarks/wall-search/raw -type d -empty -delete
          find benchmarks/wall-search/raw -type f | wc -l
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/wall-search/raw
          git commit -q -m "evidence: import raw wall-search run 41546243537 artifact"
          git push origin HEAD:claude/wall-search
