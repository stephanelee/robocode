name: Frozen old-wave fresh confirmation
on:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    name: Capture only 18 fresh confirmation rounds
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      manifest_sha: ${{ steps.capture.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify accepted collector, frozen model, passed screen and unused IDs
        run: |
          echo 'a34109512f3d451ceee64b1e47342d91b07eae8be3f1670896c448925562ddcc  benchmarks/ai-own-wave-v3/model.json' | sha256sum --check
          echo '4070177e8917fc9a131f31e6c63f215a78996bfcf665ae512412cb32126b9005  benchmarks/ai-own-wave-v3/development-report.json' | sha256sum --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          model = json.loads(Path('benchmarks/ai-own-wave-v3/model.json').read_text())
          screen = json.loads(Path('benchmarks/ai-own-wave-v3/development-report.json').read_text())
          assert screen['decision']['status'] == 'development-pass'
          assert screen['modelSha256'] == 'a34109512f3d451ceee64b1e47342d91b07eae8be3f1670896c448925562ddcc'
          layout = json.loads(subprocess.check_output(['git', 'show', '036a2358c125e0e253d299971f4b3080c2495e86:tools/fixtures/own-wave-v3/games.json']))
          assert len(layout['games']) == 6 and layout['roundsPerGame'] == 3
          assert not ({g['gameId'] for g in layout['games']} & set(model['priorGameIds']))
          assert not ({g['acquisitionId'] for g in layout['games']} & set(model['priorAcquisitionIds']))
          PY
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/accepted-collector.jar"
          rm AISurvivor/AISurvivor.jar
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/accepted-collector.jar" AISurvivor/AISurvivor.jar
          echo '1b99fa0ac303e5e5f89ed91bb3803841ded54910628f335fe1aeaeba65e34c9a  AISurvivor/AISurvivor.jar' | sha256sum --check
          python -m unittest discover -s tools -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Capture exact newly registered six games with unchanged controller
        id: capture
        run: |
          python tools/acquire_motion_pilot.py --confirmation --wave-context --plan-commit 036a2358c125e0e253d299971f4b3080c2495e86 --java "$JAVA_HOME/bin/java" --output build/own-wave-confirm
          echo "manifest_sha=$(sha256sum build/own-wave-confirm/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-wave-v3-fresh-capture
          path: build/own-wave-confirm/
          if-no-files-found: warn
  confirm:
    name: Single frozen fresh confirmation evaluation
    needs: capture
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: own-wave-v3-fresh-capture
          path: build/own-wave-confirm
      - name: Evaluate only new games once, without fitting
        env:
          MANIFEST_SHA: ${{ needs.capture.outputs.manifest_sha }}
        run: |
          python tools/containment_forecast_v3.py --stage confirm --manifest build/own-wave-confirm/manifest.json --events build/own-wave-confirm/events.jsonl --model benchmarks/ai-own-wave-v3/model.json --model-sha256 a34109512f3d451ceee64b1e47342d91b07eae8be3f1670896c448925562ddcc --confirmation-manifest-sha256 "$MANIFEST_SHA" --screen-report benchmarks/ai-own-wave-v3/development-report.json --screen-report-sha256 4070177e8917fc9a131f31e6c63f215a78996bfcf665ae512412cb32126b9005 --output build/own-wave-fresh-results
          cat build/own-wave-fresh-results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-wave-v3-fresh-results
          path: build/own-wave-fresh-results/
          if-no-files-found: warn
