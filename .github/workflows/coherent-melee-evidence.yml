name: Coherent melee evidence transfer

# Temporary: copy the existing run 41645248808 artifact into the branch. Plays no matches. Removed afterwards.
on:
  push:
    branches: [claude/melee-coherent]
    paths: [.github/workflows/coherent-melee-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coherent-melee-evidence
          run-id: 41645248808
          github-token: ${{ github.token }}
          path: benchmarks/coherent-melee/raw
      - name: Commit evidence
        run: |
          du -ah benchmarks/coherent-melee/raw | sort -h | tail -25
          # Keep only results/telemetry/logs/native stats; bot and opponent bundles are pinned and hashed in comparison.json.
          find benchmarks/coherent-melee/raw -type f ! \( -name battle.json -o -name metrics.jsonl -o -name runner.log -o -name comparison.json -o -name experiment.json -o -name preregistered-plan.md -o -path '*/retcon-stats/*' \) -delete
          find benchmarks/coherent-melee/raw -type d -empty -delete
          find benchmarks/coherent-melee/raw -type f | wc -l
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/coherent-melee/raw
          git commit -q -m "evidence: import raw coherent-melee run 41645248808 artifact"
          git push origin HEAD:claude/melee-coherent
