name: AA calibration

# Temporary preregistered A/A noise calibration (docs/aa-calibration.md). Removed after results are recorded.
on:
  push:
    branches: [claude/aa-calibration]
    paths: [.github/workflows/aa-calibration.yml]

permissions:
  contents: read

concurrency:
  group: aa-calibration
  cancel-in-progress: false

jobs:
  calibration:
    name: A/A Retcon calibration
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify committed JAR parity under Java 17
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/AISurvivor-checked-in.jar"
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/AISurvivor-checked-in.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_*.py'
          sha256sum AISurvivor/AISurvivor.jar
      - name: Install Retcon source-launch runtime after Gradle finishes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run preregistered calibration once
        run: |
          python tools/aa_calibration.py --bot-dir AISurvivor \
            --expected-jar 5ebfa64adf38ab227766b97f7f68e82aefb20251ff8d5f30575bf6b69e67c883 \
            --source "$GITHUB_SHA" --plan docs/aa-calibration.md --plan-commit "$GITHUB_SHA" \
            --blocks 10 --rounds 20 --seed-base 20261301 \
            --java "$JAVA_HOME/bin/java" --output build/aa-calibration
      - name: Print summary
        if: always()
        run: |
          [ -f build/aa-calibration/calibration.json ] || exit 0
          python -c "import json;d=json.load(open('build/aa-calibration/calibration.json'));print(json.dumps({k:d.get(k) for k in ('status','summary','failure')}, indent=1))"
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-calibration-evidence
          path: |
            build/aa-calibration/**
            !build/aa-calibration/artifacts/**
          if-no-files-found: warn
