name: Duel surf model transfer

# Temporary: copy the 16 online-training model.dat files from run 41551240407 into the branch. Plays no matches.
on:
  push:
    branches: [claude/duel-surf]
    paths: [.github/workflows/duel-surf-models.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: duel-surf-evidence
          run-id: 41551240407
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact
      - name: Copy and verify online models
        run: |
          cd "$RUNNER_TEMP/artifact"
          find online -name model.dat | sort | tee "$RUNNER_TEMP/models.txt"
          test "$(wc -l < "$RUNNER_TEMP/models.txt")" -eq 16
          while read -r f; do
            mkdir -p "$GITHUB_WORKSPACE/benchmarks/duel-surf/raw/$(dirname "$f")"
            cp "$f" "$GITHUB_WORKSPACE/benchmarks/duel-surf/raw/$f"
          done < "$RUNNER_TEMP/models.txt"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib, json, pathlib
          d = json.load(open('benchmarks/duel-surf/raw/experiment.json'))
          for i, b in enumerate(d['onlineBlocks'], 1):
              for arm in ('previous', 'candidate'):
                  p = pathlib.Path(f'benchmarks/duel-surf/raw/online/block-{i:02d}/{arm}/Retcon-train/model.dat')
                  if not p.exists():
                      p = next(pathlib.Path(f'benchmarks/duel-surf/raw/online/block-{i:02d}/{arm}').rglob('model.dat'))
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  assert digest == b[arm]['modelSHA256'], (p, digest, b[arm]['modelSHA256'])
                  print(p, digest)
          PY
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/duel-surf/raw/online
          git commit -q -m "evidence: preserve 16 online-training models from run 41551240407"
          git push origin HEAD:claude/duel-surf
