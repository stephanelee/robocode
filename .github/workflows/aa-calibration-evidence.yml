name: AA calibration evidence transfer

# Temporary: copy the existing run 41548798991 artifact into the branch. Plays no matches. Removed afterwards.
on:
  push:
    branches: [claude/aa-calibration]
    paths: [.github/workflows/aa-calibration-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aa-calibration-evidence
          run-id: 41548798991
          github-token: ${{ github.token }}
          path: benchmarks/aa-calibration/raw
      - name: Commit evidence
        run: |
          du -ah benchmarks/aa-calibration/raw | sort -h | tail -25
          # Keep only results/telemetry/logs/native stats; bot and opponent bundles are pinned and hashed in comparison.json.
          find benchmarks/aa-calibration/raw -type f ! \( -name battle.json -o -name metrics.jsonl -o -name runner.log -o -name calibration.json -o -name experiment.json -o -name preregistered-plan.md -o -path '*/retcon-stats/*' \) -delete
          find benchmarks/aa-calibration/raw -type d -empty -delete
          find benchmarks/aa-calibration/raw -type f | wc -l
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/aa-calibration/raw
          git commit -q -m "evidence: import raw A/A calibration run 41548798991 artifact"
          git push origin HEAD:claude/aa-calibration
