name: Warmup reliability evidence transfer

# Temporary: copy the existing run 41638002007 artifact into the branch. Plays no matches. Removed afterwards.
on:
  push:
    branches: [claude/foundations]
    paths: [.github/workflows/warmup-reliability-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: warmup-reliability-evidence
          run-id: 41638002007
          github-token: ${{ github.token }}
          path: benchmarks/warmup-reliability/raw
      - name: Commit evidence
        run: |
          du -ah benchmarks/warmup-reliability/raw | sort -h | tail -25
          # Keep only results/telemetry/logs/native stats; bot and opponent bundles are pinned and hashed in comparison.json.
          find benchmarks/warmup-reliability/raw -type f ! \( -name battle.json -o -name metrics.jsonl -o -name runner.log -o -name comparison.json -o -name experiment.json -o -name preregistered-plan.md -o -path '*/retcon-stats/*' \) -delete
          find benchmarks/warmup-reliability/raw -type d -empty -delete
          find benchmarks/warmup-reliability/raw -type f | wc -l
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/warmup-reliability/raw
          git commit -q -m "evidence: import raw warm-up reliability run 41638002007 artifact"
          git push origin HEAD:claude/foundations
