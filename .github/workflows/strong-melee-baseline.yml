name: Frozen stronger native melee baseline
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  melee:
    if: github.head_ref == 'codex/strong-melee-baseline'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frozen source and fresh Java17 parity
        shell: bash
        run: |
          git diff --exit-code cf9f68b16a1b123309611e2f0f506e5be10f388f HEAD -- docs/improvements/strong-melee-baseline-continuation.md
          test -z "$(git diff --name-only 1e31cceca5cf7f0ffe59dcbdc5f71015a4945871 HEAD -- src/main/java src/test/java AISurvivor tools/benchmark.py tools/BenchmarkBattle.java tools/retcon.py tools/retcon_stats.py tools/melee_default_baseline.py)"
          mkdir -p "$RUNNER_TEMP/frozen-strong-melee"
          for name in AISurvivor.jar AISurvivor.json AISurvivor.sh AISurvivor.cmd; do
            git show "1e31cceca5cf7f0ffe59dcbdc5f71015a4945871:AISurvivor/$name" > "$RUNNER_TEMP/frozen-strong-melee/$name"
          done
          echo "9679fc5ee27b68877f0b6d89a2104ffff115d6251ec44d3036fdd1f1d64988a6  $RUNNER_TEMP/frozen-strong-melee/AISurvivor.jar" | sha256sum -c -
          rm AISurvivor/AISurvivor.jar
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/frozen-strong-melee/AISurvivor.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_strong*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: One registered native-opponent melee baseline
        run: >-
          python tools/strong_melee_baseline.py --bot-dir "$RUNNER_TEMP/frozen-strong-melee"
          --java "$JAVA_HOME/bin/java" --output build/strong-melee-baseline
      - name: Preserve complete or failed attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-melee-baseline-${{ github.event.pull_request.head.sha }}
          path: |
            build/strong-melee-baseline/
            tools/strong_melee_baseline.py
            tools/strong_melee_opponents.py
            tools/opponents/strong-melee.lock.json
            docs/improvements/strong-melee-baseline-continuation.md
            .github/workflows/strong-melee-baseline.yml
          retention-days: 30
          if-no-files-found: warn
