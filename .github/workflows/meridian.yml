name: Meridian registered duel
on:
  pull_request:
    types: [opened, labeled]
permissions:
  contents: read
jobs:
  duel:
    if: github.head_ref == 'codex/meridian-duel' && (github.event.action == 'opened' || github.event.label.name == 'run-meridian-v1' || github.event.label.name == 'profile-meridian-v1')
    runs-on: ubuntu-26.04
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Meridian on Java 17 and verify parity
        run: |
          mkdir -p build/meridian
          java -version 2>build/meridian/build-java.txt
          sha256sum "$JAVA_HOME/bin/javac" "$JAVA_HOME/lib/modules" | sed 's@  .*/@  @' > build/meridian/build-java.sha256
          ./gradlew --no-daemon -p experiments/Meridian clean build
          python tools/verify_jar.py experiments/Meridian/Meridian.jar experiments/Meridian/build/bot/Meridian/Meridian.jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate and identify exact battle runtime (no games)
        run: python tools/meridian_profile.py
      - name: Publish runtime identity before any game
        uses: actions/upload-artifact@v4
        with:
          name: meridian-profile-${{ github.run_id }}
          path: build/meridian/
      - name: Run the reviewed registration
        if: github.event.action == 'labeled' && github.event.label.name == 'run-meridian-v1'
        run: |
          cmp benchmarks/meridian-v1/profile.json build/meridian/profile.json
          python tools/meridian_duels.py
      - name: Preserve all attempts
        if: always() && github.event.label.name == 'run-meridian-v1'
        uses: actions/upload-artifact@v4
        with:
          name: meridian-games-${{ github.run_id }}
          path: build/meridian/
          retention-days: 30
