name: KeelWake zero-game Java 17 build
on:
  pull_request:
    paths:
      - 'experiments/KeelWake/**'
      - '.github/workflows/keel-wake-build.yml'
      - 'tools/verify_jar.py'
      - 'tools/keel_wake*.py'
      - 'tools/test_keel_wake*.py'
      - 'benchmarks/keel-wake-v1/freeze.json'
      - 'benchmarks/keel-wake-v1/independent-analysis/**'
      - 'benchmarks/keel-wake-v1/image-probe-validation/**'
permissions:
  contents: read
jobs:
  build:
    name: KeelWake Java 17 bootstrap (zero games)
    if: github.head_ref == 'codex/keel-wake-v1'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
      - name: Build and test twice on the exact Java 17 runtime; launch no bots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/keel-wake-bootstrap
          {
            set -x
            java -version
            javac -version
            ./gradlew --version
            git rev-parse HEAD
            if test -f experiments/KeelWake/KeelWake.jar; then
              cp experiments/KeelWake/KeelWake.jar build/keel-wake-bootstrap/KeelWake-committed.jar
            fi
            ./gradlew -p experiments/KeelWake --no-daemon clean build
            cp experiments/KeelWake/build/bot/KeelWake/KeelWake.jar build/keel-wake-bootstrap/KeelWake-first.jar
            ./gradlew -p experiments/KeelWake --no-daemon clean build
            cp experiments/KeelWake/build/bot/KeelWake/KeelWake.jar build/keel-wake-bootstrap/KeelWake.jar
            python tools/verify_jar.py build/keel-wake-bootstrap/KeelWake-first.jar build/keel-wake-bootstrap/KeelWake.jar
            cmp build/keel-wake-bootstrap/KeelWake-first.jar build/keel-wake-bootstrap/KeelWake.jar
            if test -f build/keel-wake-bootstrap/KeelWake-committed.jar; then
              python tools/verify_jar.py build/keel-wake-bootstrap/KeelWake-committed.jar build/keel-wake-bootstrap/KeelWake.jar
            fi
            sha256sum build/keel-wake-bootstrap/*.jar
          } 2>&1 | tee build/keel-wake-bootstrap/build.log
      - name: Validate new controller and independent audit fixtures on pinned Python (zero games)
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/test_keel_wake_experiment.py; then
            python -I -B -S -m unittest discover -s tools -p 'test_keel_wake*.py' -v 2>&1 | tee build/keel-wake-bootstrap/controller-tests.log
          fi
          if test -f benchmarks/keel-wake-v1/independent-analysis/test_audit.py; then
            python -I -B -S -m unittest discover -s benchmarks/keel-wake-v1/independent-analysis -p test_audit.py -v 2>&1 | tee build/keel-wake-bootstrap/independent-audit-tests.log
          fi
          if test -f benchmarks/keel-wake-v1/image-probe-validation/test_image_probe.py; then
            python -I -B -S -m unittest discover -s benchmarks/keel-wake-v1/image-probe-validation -p test_image_probe.py -v 2>&1 | tee build/keel-wake-bootstrap/image-probe-tests.log
          fi
      - name: Preserve source, runtime, JAR and test provenance even on a failed build
        if: always()
        shell: bash
        run: |
          mkdir -p build/keel-wake-bootstrap
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.')
          out = root / 'build/keel-wake-bootstrap'
          files = subprocess.check_output(['git', 'ls-files', '-z', 'experiments/KeelWake', 'experiments/Keel/Keel.jar', 'experiments/Keel/bot/Keel.json', 'benchmarks/keel-wake-v1/baseline.json', 'benchmarks/keel-wake-v1/registration.json', 'benchmarks/keel-wake-v1/runtime-pins.json', '.github/workflows/keel-wake-build.yml', 'tools/verify_jar.py']).decode().split('\0')
          hashes = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files if p and pathlib.Path(p).is_file()}
          jars = {p.name: {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.glob('*.jar')}
          proof = {'schemaVersion': 1, 'purpose': 'zero-game pure semantic build; no competitive outcome or runtime clearance', 'headSHA': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'runId': int(os.environ['GITHUB_RUN_ID']), 'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'runnerOS': os.environ.get('RUNNER_OS'), 'guestImageOSClaim': os.environ.get('ImageOS'), 'guestImageVersionClaim': os.environ.get('ImageVersion'), 'javaHome': os.environ.get('JAVA_HOME'), 'javaVersion': subprocess.check_output(['java','-version'], stderr=subprocess.STDOUT, text=True), 'pythonVersion': subprocess.check_output(['python','--version'], text=True).strip(), 'sourceFilesSHA256': hashes, 'jars': jars, 'firstCommittedJarPresent': (out/'KeelWake-committed.jar').is_file()}
          (out/'provenance.json').write_text(json.dumps(proof, indent=2)+'\n')
          PYTHON
      - name: Upload actual bootstrap outputs and original semantic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keel-wake-zero-game-build-${{ github.run_id }}
          path: |
            build/keel-wake-bootstrap/
            experiments/KeelWake/build/test-results/
            experiments/KeelWake/build/reports/tests/
          if-no-files-found: error
          retention-days: 90
