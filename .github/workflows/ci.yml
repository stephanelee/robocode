name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 17 build and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test from source
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/AISurvivor-checked-in.jar"
          rm -f AISurvivor/AISurvivor.jar
          ./gradlew --no-daemon clean build
      - name: Verify checked-in JAR matches source
        run: python tools/verify_jar.py "$RUNNER_TEMP/AISurvivor-checked-in.jar" AISurvivor/AISurvivor.jar
      - name: Test final experimental output barrier (no games)
        run: python -m unittest discover -s tools -p test_challenger_completion.py -v
      - name: Test isolated Challenger lifecycle and verify its JAR
        run: |
          ./gradlew -p experiments/DiamondChallenger --no-daemon clean build
          python tools/verify_jar.py experiments/DiamondChallenger/DiamondChallenger.jar experiments/DiamondChallenger/build/bot/DiamondChallenger/DiamondChallenger.jar
      - name: Build Meridian, test its physics and compare the committed JAR
        run: |
          python tools/meridian_gun_plan_fixture.py
          ./gradlew -p experiments/Meridian --no-daemon clean build
          python tools/verify_jar.py experiments/Meridian/Meridian.jar experiments/Meridian/build/bot/Meridian/Meridian.jar
      - name: Compile isolated wave support diagnostic (no execution)
        if: github.head_ref == 'codex/meridian-wave-support'
        run: ./gradlew -p experiments/Meridian --no-daemon waveSupportArtifact
      - name: Build isolated MeridianPeak and verify its committed JAR
        if: github.head_ref == 'codex/meridian-peak-v1'
        run: |
          ./gradlew -p experiments/MeridianPeak --no-daemon clean build
          python tools/verify_jar.py experiments/MeridianPeak/MeridianPeak.jar experiments/MeridianPeak/build/bot/MeridianPeak/MeridianPeak.jar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            experiments/DiamondChallenger/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload runnable bot
        uses: actions/upload-artifact@v4
        with:
          name: AISurvivor-java17
          path: |
            AISurvivor/AISurvivor.jar
            AISurvivor/AISurvivor.json
            AISurvivor/AISurvivor.cmd
            AISurvivor/AISurvivor.sh
          if-no-files-found: error
