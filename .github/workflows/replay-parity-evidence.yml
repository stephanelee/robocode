name: Replay parity evidence transfer

# Temporary: copy the existing run 41642071703 artifact into the branch. Plays no matches. Removed afterwards.
on:
  push:
    branches: [claude/replay-harness]
    paths: [.github/workflows/replay-parity-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: replay-parity-evidence
          run-id: 41642071703
          github-token: ${{ github.token }}
          path: benchmarks/replay-harness-parity/raw
      - name: Commit evidence
        run: |
          du -ah benchmarks/replay-harness-parity/raw | sort -h | tail -25
          # Keep only results/telemetry/logs/native stats; bot and opponent bundles are pinned and hashed in comparison.json.
          find benchmarks/replay-harness-parity/raw -type f ! \( -name battle.json -o -name metrics.jsonl -o -name runner.log -o -name comparison.json -o -name experiment.json -o -name preregistered-plan.md -o -path '*/retcon-stats/*' \) -delete
          find benchmarks/replay-harness-parity/raw -type d -empty -delete
          find benchmarks/replay-harness-parity/raw -type f | wc -l
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/replay-harness-parity/raw
          git commit -q -m "evidence: import raw replay-harness parity run 41642071703 artifact"
          git push origin HEAD:claude/replay-harness
