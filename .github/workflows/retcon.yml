name: Retcon benchmark

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: Run 20 training and 5 evaluation rounds per policy against Retcon
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retcon:
    if: github.event_name != 'pull_request' || (github.head_ref != 'codex/keel-improvement-baseline' && github.head_ref != 'codex/keel-brace-v1')
    name: Retcon 1v1 compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify AISurvivor under Java 17
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/AISurvivor-checked-in.jar"
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/AISurvivor-checked-in.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Install Retcon source-launch runtime after Gradle finishes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run bounded actual Retcon matches
        env:
          FULL: ${{ inputs.full || false }}
        run: |
          if [ "$FULL" = "true" ]; then
            python tools/benchmark.py --suite retcon --java "$JAVA_HOME/bin/java" --rounds 5 --training-rounds 20 --timeout 900 --require-metrics --require-retcon-stats --output build/retcon
          else
            python tools/benchmark.py --suite retcon --smoke --java "$JAVA_HOME/bin/java" --timeout 180 --require-metrics --require-retcon-stats --output build/retcon
          fi
      - name: Print canonical Retcon evidence and failure diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          evidence = Path('build/retcon/results.json')
          if evidence.exists():
              print('RETCON_JSON_BEGIN')
              print(evidence.read_text())
              print('RETCON_JSON_END')
          for log in Path('build/retcon').glob('*/runner.log'):
              print(f'RUNNER_LOG_TAIL {log}')
              print('\n'.join(log.read_text(errors='replace').splitlines()[-30:]))
          diagnostic = Path('build/retcon-observability/results.json')
          if diagnostic.exists():
              print('RETCON_OBSERVABILITY_JSON_BEGIN')
              print(diagnostic.read_text())
              print('RETCON_OBSERVABILITY_JSON_END')
          PY
      - name: Upload Retcon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retcon-results
          path: |
            build/retcon/results.json
            build/retcon/results.csv
            build/retcon/dashboard.html
            build/retcon/*/battle.json
            build/retcon/*/metrics.jsonl
            build/retcon/*/runner.log
            build/retcon/*/retcon-stats/**
            build/retcon-observability/results.json
            build/retcon-observability/block-*/*/battle.json
            build/retcon-observability/block-*/*/metrics.jsonl
            build/retcon-observability/block-*/*/runner.log
            build/retcon-observability/block-*/*/retcon-stats/**
          if-no-files-found: warn
