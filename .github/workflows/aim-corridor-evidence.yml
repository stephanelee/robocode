name: Aim corridor evidence transfer

# Temporary: copy the existing run 41532956899 artifact into the branch. Plays no matches. Removed afterwards.
on:
  push:
    branches: [claude/aim-corridor]
    paths: [.github/workflows/aim-corridor-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aim-corridor-evidence
          run-id: 41532956899
          github-token: ${{ github.token }}
          path: benchmarks/aim-corridor/raw
      - name: Commit evidence
        run: |
          du -ah benchmarks/aim-corridor/raw | sort -h | tail -25
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/aim-corridor/raw
          git commit -q -m "evidence: import raw aim-corridor run 41532956899 artifact 13183485154"
          git push origin HEAD:claude/aim-corridor
