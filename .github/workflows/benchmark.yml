name: Battle benchmark

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: Run fixed, cold DQN, training, and trained evaluation scenarios
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  battle:
    if: github.head_ref != 'codex/meridian-held-plan-execution' && github.head_ref != 'codex/meridian-wave-support' && github.head_ref != 'codex/meridian-peak-v1' && github.head_ref != 'codex/diamond-stop-contract24'
    name: Headless battle smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test benchmark tooling
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build current bot from source
        run: ./gradlew --no-daemon clean build
      - name: Run headless reference experiment
        env:
          FULL: ${{ inputs.full || false }}
        run: |
          if [ "$FULL" = "true" ]; then
            python tools/benchmark.py --rounds 5 --training-rounds 20 --timeout 90 --require-metrics
          else
            python tools/benchmark.py --smoke --timeout 90 --require-metrics
          fi
      - name: Print canonical experiment evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          evidence = Path('build/benchmark/results.json')
          if evidence.exists():
              print('BENCHMARK_JSON_BEGIN')
              print(evidence.read_text())
              print('BENCHMARK_JSON_END')
          PY
      - name: Upload experiment and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-results
          path: |
            build/benchmark/results.json
            build/benchmark/results.csv
            build/benchmark/dashboard.html
            build/benchmark/*/battle.json
            build/benchmark/*/metrics.jsonl
            build/benchmark/*/runner.log
          if-no-files-found: warn
