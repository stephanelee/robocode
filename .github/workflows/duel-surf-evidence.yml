name: Duel surf evidence transfer

# Temporary: copy the existing run 41551240407 artifact into the branch. Plays no matches. Removed afterwards.
on:
  push:
    branches: [claude/duel-surf]
    paths: [.github/workflows/duel-surf-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: duel-surf-evidence
          run-id: 41551240407
          github-token: ${{ github.token }}
          path: benchmarks/duel-surf/raw
      - name: Commit evidence
        run: |
          du -ah benchmarks/duel-surf/raw | sort -h | tail -25
          # Keep only results/telemetry/logs/native stats; bot and opponent bundles are pinned and hashed in comparison.json.
          find benchmarks/duel-surf/raw -type f ! \( -name battle.json -o -name metrics.jsonl -o -name runner.log -o -name comparison.json -o -name experiment.json -o -name preregistered-plan.md -o -path '*/retcon-stats/*' \) -delete
          find benchmarks/duel-surf/raw -type d -empty -delete
          find benchmarks/duel-surf/raw -type f | wc -l
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/duel-surf/raw
          git commit -q -m "evidence: import raw duel-surf run 41551240407 artifact"
          git push origin HEAD:claude/duel-surf
