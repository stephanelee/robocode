name: Facet Java 17 semantics and artifact

on:
  pull_request:
    paths:
      - 'experiments/Facet/**'
      - '.github/workflows/facet.yml'
      - 'tools/facet_*.py'
      - 'tools/test_facet_*.py'
      - 'tools/BenchmarkBattle.java'
      - 'tools/FacetCompletionBarrierTest.java'
  push:
    branches: [master, 'facet/**']
    paths:
      - 'experiments/Facet/**'
      - '.github/workflows/facet.yml'
      - 'tools/facet_*.py'
      - 'tools/test_facet_*.py'
      - 'tools/BenchmarkBattle.java'
      - 'tools/FacetCompletionBarrierTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facet:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Facet, run semantics, verify committed artifact
        run: ./gradlew -p experiments/Facet --no-daemon clean build verifyJarParity
      - name: Test screen evidence and acquisition guards without battles
        run: PYTHONPATH=tools python3 -m unittest tools/test_facet_benchmark.py tools/test_facet_python_runtime.py tools/test_facet_report.py
      - name: Test Facet runner-lifetime completion barrier without battles
        run: |
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"tools"); import benchmark; benchmark.download(Path("build/facet-runner-contract"), "robocode-tankroyale-runner-1.4.0.jar", benchmark.ASSETS["robocode-tankroyale-runner-1.4.0.jar"])'
          mkdir -p build/facet-runner-contract/classes
          javac --release 17 -cp build/facet-runner-contract/robocode-tankroyale-runner-1.4.0.jar -d build/facet-runner-contract/classes tools/BenchmarkBattle.java tools/FacetCompletionBarrierTest.java
          java -Xmx256m -cp build/facet-runner-contract/classes:build/facet-runner-contract/robocode-tankroyale-runner-1.4.0.jar FacetCompletionBarrierTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facet-java17-validation
          path: |
            experiments/Facet/build/reports/
            experiments/Facet/build/test-results/
            experiments/Facet/build/libs/Facet.jar
