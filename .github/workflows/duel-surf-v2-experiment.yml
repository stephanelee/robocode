name: Duel surf v2 experiment

# Temporary preregistered experiment (docs/improvements/duel-surf-v2.md). Removed after results are recorded.
on:
  push:
    branches: [claude/duel-surf]
    paths: [.github/workflows/duel-surf-v2-experiment.yml]

permissions:
  contents: read

concurrency:
  group: duel-surf-v2-experiment
  cancel-in-progress: false

jobs:
  calibration:
    name: Duel surf v2 Retcon/sample experiment
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify committed JAR parity under Java 17
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/AISurvivor-checked-in.jar"
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/AISurvivor-checked-in.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_*.py'
          sha256sum AISurvivor/AISurvivor.jar
      - name: Install Retcon source-launch runtime after Gradle finishes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Materialize accepted baseline bot
        run: |
          git worktree add "$RUNNER_TEMP/baseline" dccc19d1d37ae07ce37ea5d300659d45395bfc1f
          sha256sum "$RUNNER_TEMP/baseline/AISurvivor/AISurvivor.jar"
      - name: Run preregistered experiment once
        run: |
          python tools/block_experiment.py --previous-bot-dir "$RUNNER_TEMP/baseline/AISurvivor" \
            --expected-previous-jar 5ebfa64adf38ab227766b97f7f68e82aefb20251ff8d5f30575bf6b69e67c883 \
            --previous-source dccc19d1d37ae07ce37ea5d300659d45395bfc1f \
            --candidate-source "$GITHUB_SHA" --plan docs/improvements/duel-surf-v2.md --plan-commit "$GITHUB_SHA" \
            --blocks 8 --rounds 20 --seed-base 20261501 --sample-seed 20261509 --bound t \
            --java "$JAVA_HOME/bin/java" --output build/duel-surf-v2
      - name: Print summary
        if: always()
        run: |
          [ -f build/duel-surf-v2/experiment.json ] || exit 0
          python -c "import json;d=json.load(open('build/duel-surf-v2/experiment.json'));print(json.dumps({k:d.get(k) for k in ('status','decision','primary','primaryMechanism','online','failure')}, indent=1))"
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-surf-v2-evidence
          path: |
            build/duel-surf-v2/**
            !build/duel-surf-v2/artifacts/**
            !build/duel-surf-v2/official-samples/**
          if-no-files-found: warn
