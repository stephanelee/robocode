name: Warmup reliability experiment

# Temporary preregistered experiment (docs/improvements/warmup-reliability.md). Removed after results are recorded.
on:
  push:
    branches: [claude/foundations]
    paths: [.github/workflows/warmup-reliability.yml]

permissions:
  contents: read

concurrency:
  group: warmup-reliability
  cancel-in-progress: false

jobs:
  experiment:
    name: Warm-up reliability (Retcon + melee)
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify committed JAR parity under Java 17
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/AISurvivor-checked-in.jar"
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/AISurvivor-checked-in.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_*.py'
          sha256sum AISurvivor/AISurvivor.jar
      - name: Install Retcon source-launch runtime after Gradle finishes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Materialize accepted baseline bot
        run: |
          git worktree add "$RUNNER_TEMP/baseline" e4e4c94
          sha256sum "$RUNNER_TEMP/baseline/AISurvivor/AISurvivor.jar"
      - name: Run preregistered experiment once
        run: |
          python tools/reliability_experiment.py --previous-bot-dir "$RUNNER_TEMP/baseline/AISurvivor" \
            --expected-previous-jar 9679fc5ee27b68877f0b6d89a2104ffff115d6251ec44d3036fdd1f1d64988a6 \
            --previous-source "$(git rev-parse e4e4c94)" \
            --candidate-source "$GITHUB_SHA" --plan docs/improvements/warmup-reliability.md --plan-commit "$GITHUB_SHA" \
            --games 15 --rounds 2 --seed-base 20261601 \
            --java "$JAVA_HOME/bin/java" --output build/warmup-reliability
      - name: Print summary
        if: always()
        run: |
          [ -f build/warmup-reliability/experiment.json ] || exit 0
          python -c "import json;d=json.load(open('build/warmup-reliability/experiment.json'));print(json.dumps({k:d.get(k) for k in ('status','decision','summary','failure')}, indent=1))"
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warmup-reliability-evidence
          path: |
            build/warmup-reliability/**
            !build/warmup-reliability/artifacts/**
            !build/warmup-reliability/official-samples/**
          if-no-files-found: warn
