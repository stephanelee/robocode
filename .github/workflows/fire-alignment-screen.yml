name: Fire alignment screen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build candidate and verify committed JAR
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/committed.jar"
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/committed.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_*.py' -q
          mkdir -p build/fire-baseline
          git archive 204ad4c9 AISurvivor | tar -x -C build/fire-baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run immutable 48-round diagnostic
        run: python tools/fire_alignment_screen.py --previous-bot-dir build/fire-baseline/AISurvivor --candidate-source "$GITHUB_SHA" --java "$JAVA_HOME/bin/java" --output build/fire-screen
      - name: Preserve every outcome and partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-alignment-screen
          path: build/fire-screen/
          if-no-files-found: warn
