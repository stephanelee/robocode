name: Cycle 1 steering experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    if: github.head_ref == 'codex/improve-steering-cycle1'
    name: Cycle 1 measured comparison
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test tooling and candidate before measuring
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          ./gradlew --no-daemon clean build
      - name: Snapshot the previous version
        env:
          PREVIOUS_SOURCE: 86e4a2b7c112ffd054475a3b5fc1cf0c9243b0bb
        run: |
          mkdir -p "$RUNNER_TEMP/previous-bot"
          for name in AISurvivor.jar AISurvivor.json AISurvivor.sh AISurvivor.cmd; do
            git show "$PREVIOUS_SOURCE:AISurvivor/$name" > "$RUNNER_TEMP/previous-bot/$name"
          done
          chmod +x "$RUNNER_TEMP/previous-bot/AISurvivor.sh"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run preregistered 120-round primary comparison
        env:
          CANDIDATE_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/compare.py \
            --previous-bot-dir "$RUNNER_TEMP/previous-bot" --candidate-bot-dir AISurvivor \
            --previous-source 86e4a2b7c112ffd054475a3b5fc1cf0c9243b0bb --candidate-source "$CANDIDATE_SOURCE" \
            --plan docs/improvements/cycle-1.md --plan-commit c7b08e33927f2fd961d2e81d2076b4039255f5e3 \
            --policy untrained --rounds 20 --timeout 300 --output build/comparison-primary
      - name: Run fixed-policy diagnostic only after primary passes
        env:
          CANDIDATE_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          decision=$(python -c "import json; print(json.load(open('build/comparison-primary/comparison.json'))['decision']['status'])")
          if [ "$decision" = "retain" ]; then
            python tools/compare.py \
              --previous-bot-dir "$RUNNER_TEMP/previous-bot" --candidate-bot-dir AISurvivor \
              --previous-source 86e4a2b7c112ffd054475a3b5fc1cf0c9243b0bb --candidate-source "$CANDIDATE_SOURCE" \
              --plan docs/improvements/cycle-1.md --plan-commit c7b08e33927f2fd961d2e81d2076b4039255f5e3 \
              --policy fixed-minrisk --purpose diagnostic --rounds 5 --timeout 180 --output build/comparison-fixed
          fi
      - name: Print canonical comparison summaries
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('build').glob('comparison-*/comparison.json')):
              print(f'COMPARISON_JSON_BEGIN {path}')
              print(path.read_text())
              print('COMPARISON_JSON_END')
          PY
      - name: Preserve complete experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-1-comparison
          path: build/comparison-*/
          retention-days: 30
          if-no-files-found: warn
