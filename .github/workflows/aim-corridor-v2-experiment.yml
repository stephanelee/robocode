name: Aim corridor v2 experiment

# Temporary preregistered experiment (docs/improvements/aim-corridor-v2.md). Removed after results are recorded.
on:
  push:
    branches: [claude/aim-corridor-v2]
    paths: [.github/workflows/aim-corridor-v2-experiment.yml]

permissions:
  contents: read

concurrency:
  group: aim-corridor-v2-experiment
  cancel-in-progress: false

jobs:
  experiment:
    name: Aim corridor Retcon/sample experiment
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build candidate and verify committed JAR parity under Java 17
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/AISurvivor-checked-in.jar"
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/AISurvivor-checked-in.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_*.py'
          sha256sum AISurvivor/AISurvivor.jar
      - name: Materialize accepted baseline bot
        run: |
          git worktree add "$RUNNER_TEMP/baseline" 116c47ccc77e85f9c8f570c554f5e626a4ed76d4
          sha256sum "$RUNNER_TEMP/baseline/AISurvivor/AISurvivor.jar"
      - name: Install Retcon source-launch runtime after Gradle finishes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run preregistered experiment once
        run: |
          python tools/aim_corridor_experiment.py \
            --previous-bot-dir "$RUNNER_TEMP/baseline/AISurvivor" \
            --previous-source 116c47ccc77e85f9c8f570c554f5e626a4ed76d4 \
            --expected-previous-jar 1b99fa0ac303e5e5f89ed91bb3803841ded54910628f335fe1aeaeba65e34c9a \
            --candidate-source "$GITHUB_SHA" --plan-commit "$GITHUB_SHA" \
            --java "$JAVA_HOME/bin/java" --output build/aim-corridor-v2 \
            --plan-path docs/improvements/aim-corridor-v2.md --seeds 20261211,20261212,20261213 --sample-seed 20261214
      - name: Print canonical evidence
        if: always()
        run: |
          for f in build/aim-corridor-v2/experiment.json build/aim-corridor-v2/primary/comparison.json build/aim-corridor-v2/online-veto/comparison.json; do
            [ -f "$f" ] || continue; { echo "BEGIN $f"; python -c "import json,sys;d=json.load(open('$f'));print(json.dumps({k:d[k] for k in d if k in ('status','decision','primary','onlineVeto','samples','failure','candidateJarSHA256','runtimeOS')}, indent=1)[:200000])"; echo "END $f"; }
          done
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aim-corridor-v2-evidence
          path: |
            build/aim-corridor-v2/**
            !build/aim-corridor-v2/official-samples/**
            !build/aim-corridor-v2/**/artifacts/**
          if-no-files-found: warn
