name: Aim corridor v2 evidence transfer

# Temporary: copy the existing run 41542518773 artifact into the branch. Plays no matches. Removed afterwards.
on:
  push:
    branches: [claude/aim-corridor-v2]
    paths: [.github/workflows/aim-corridor-v2-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aim-corridor-v2-evidence
          run-id: 41542518773
          github-token: ${{ github.token }}
          path: benchmarks/aim-corridor-v2/raw
      - name: Commit evidence
        run: |
          du -ah benchmarks/aim-corridor-v2/raw | sort -h | tail -25
          # Keep only results/telemetry/logs/native stats; bot and opponent bundles are pinned and hashed in comparison.json.
          find benchmarks/aim-corridor-v2/raw -type f ! \( -name battle.json -o -name metrics.jsonl -o -name runner.log -o -name comparison.json -o -name experiment.json -o -name preregistered-plan.md -o -path '*/retcon-stats/*' \) -delete
          find benchmarks/aim-corridor-v2/raw -type d -empty -delete
          find benchmarks/aim-corridor-v2/raw -type f | wc -l
          git config user.name "Stéphane Lee"
          git config user.email "30698997+stephanelee@users.noreply.github.com"
          git add benchmarks/aim-corridor-v2/raw
          git commit -q -m "evidence: import raw aim-corridor run 41542518773 artifact"
          git push origin HEAD:claude/aim-corridor-v2
