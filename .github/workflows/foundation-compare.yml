name: Foundation scan-lag comparison
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    name: Fixed primary and default-online veto
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build candidate and verify tracked JAR
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/candidate-tracked.jar"
          rm AISurvivor/AISurvivor.jar
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/candidate-tracked.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          ref: a1417774d4f31c43dca0cb83b13c9b216989fbb0
          path: previous
      - name: Guard accepted incumbent and registered plan
        run: |
          echo '0d120a0461a7bf32b1c6d6277da34f9480309f255caa44e168e6bcdf8636bff2  previous/AISurvivor/AISurvivor.jar' | sha256sum --check
          git show 9b5a5313f13719920b8abf04094dd9438a74b7df:docs/retcon-strategy.md > "$RUNNER_TEMP/registered-plan.md"
          test -s "$RUNNER_TEMP/registered-plan.md"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Record actual pinned-engine precondition on match runtime
        run: python tools/engine_energy_trace.py --java "$JAVA_HOME/bin/java" --output build/foundation/engine-trace
      - name: Fixed minimum-risk primary — all 120 scored rounds
        id: primary
        env:
          CANDIDATE_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/compare.py --previous-bot-dir previous/AISurvivor --candidate-bot-dir AISurvivor --previous-source a1417774d4f31c43dca0cb83b13c9b216989fbb0 --candidate-source "$CANDIDATE_SOURCE" --plan docs/retcon-strategy.md --plan-commit 9b5a5313f13719920b8abf04094dd9438a74b7df --plan-addendum docs/improvements/foundation-scan-lag.md --plan-addendum-commit 677f622c8b90b89783b224e59d90e0da9942eca2 --category correctness --policy fixed-minrisk --purpose primary --seeds 20261102,20261103,20261104 --rounds 20 --timeout 900 --java "$JAVA_HOME/bin/java" --require-retcon-stats --output build/foundation/fixed
          python - <<'PY'
          import json, os
          report = json.load(open('build/foundation/fixed/comparison.json'))
          assert report['status'] == 'complete' and report['validatedScoredRounds'] == 120
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('passed=' + str(report['decision']['status'] == 'retain').lower(), file=out)
          PY
      - name: Mandatory default online-training veto — all 120 scored rounds
        if: steps.primary.outputs.passed == 'true'
        env:
          CANDIDATE_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/compare.py --previous-bot-dir previous/AISurvivor --candidate-bot-dir AISurvivor --previous-source a1417774d4f31c43dca0cb83b13c9b216989fbb0 --candidate-source "$CANDIDATE_SOURCE" --plan docs/retcon-strategy.md --plan-commit 9b5a5313f13719920b8abf04094dd9438a74b7df --plan-addendum docs/improvements/foundation-scan-lag.md --plan-addendum-commit 677f622c8b90b89783b224e59d90e0da9942eca2 --category correctness --policy online-train --purpose primary --seeds 20261102,20261103,20261104 --rounds 20 --training-rounds 20 --timeout 900 --java "$JAVA_HOME/bin/java" --require-retcon-stats --output build/foundation/online
      - name: Print canonical decisions and diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('build/foundation').rglob('comparison.json'):
              print(str(path), path.read_text())
          for path in Path('build/foundation').rglob('runner.log'):
              print(str(path), '\n'.join(path.read_text(errors='replace').splitlines()[-20:]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-scan-lag-evidence
          path: build/foundation/
          if-no-files-found: warn
