name: Coherent melee experiment

# Temporary preregistered experiment (docs/improvements/coherent-melee.md). Removed after results are recorded.
on:
  push:
    branches: [claude/melee-coherent]
    paths: [.github/workflows/coherent-melee.yml]

permissions:
  contents: read

concurrency:
  group: coherent-melee
  cancel-in-progress: false

jobs:
  experiment:
    name: Coherent melee (melee + Retcon + samples)
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify committed JAR parity under Java 17
        run: |
          cp AISurvivor/AISurvivor.jar "$RUNNER_TEMP/AISurvivor-checked-in.jar"
          ./gradlew --no-daemon clean build
          python tools/verify_jar.py "$RUNNER_TEMP/AISurvivor-checked-in.jar" AISurvivor/AISurvivor.jar
          python -m unittest discover -s tools -p 'test_*.py'
          sha256sum AISurvivor/AISurvivor.jar
      - name: Install Retcon source-launch runtime after Gradle finishes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Materialize accepted baseline bot
        run: |
          git worktree add "$RUNNER_TEMP/baseline" e4e4c94
          sha256sum "$RUNNER_TEMP/baseline/AISurvivor/AISurvivor.jar"
      - name: Run preregistered experiment once
        run: |
          python tools/melee_experiment.py --previous-bot-dir "$RUNNER_TEMP/baseline/AISurvivor" \
            --expected-previous-jar 9679fc5ee27b68877f0b6d89a2104ffff115d6251ec44d3036fdd1f1d64988a6 \
            --previous-source "$(git rev-parse e4e4c94)" \
            --candidate-source "$GITHUB_SHA" --plan docs/improvements/coherent-melee.md --plan-commit "$GITHUB_SHA" \
            --melee-blocks 10 --melee-rounds 10 --retcon-blocks 16 --retcon-rounds 20 --seed-base 20261901 \
            --java "$JAVA_HOME/bin/java" --output build/coherent-melee
      - name: Print summary
        if: always()
        run: |
          [ -f build/coherent-melee/experiment.json ] || exit 0
          python -c "import json;d=json.load(open('build/coherent-melee/experiment.json'));print(json.dumps({k:d.get(k) for k in ('status','decision','melee','retcon','failure')}, indent=1))"
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherent-melee-evidence
          path: |
            build/coherent-melee/**
            !build/coherent-melee/artifacts/**
            !build/coherent-melee/official-samples/**
          if-no-files-found: warn
